# Enable auto-merge for Dependabot minor and patch updates of the uv and
# pre-commit ecosystems. GitHub merges the PR only after all required status
# checks (CI workflow) have passed. Docker and GitHub Actions updates and all
# major updates are left open for manual review.
#
# Repository prerequisites (without them `gh pr merge --auto` merges at once,
# before CI has finished):
#   - Settings → General → "Allow auto-merge" enabled
#   - A branch ruleset on main requiring the CI checks (lint, secrets,
#     pytest (Checkmk 2.4), pytest (Checkmk 2.5), mkp) to pass before merging
name: Dependabot Auto-Merge

on: pull_request

permissions: {}

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98  # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Enable auto-merge for minor and patch updates
        if: >-
          contains(fromJSON('["uv", "pre_commit"]'), steps.metadata.outputs.package-ecosystem) &&
          (steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
           steps.metadata.outputs.update-type == 'version-update:semver-patch')
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
