# Build and release the MKP package when a version tag is pushed.
# Tags must be valid Checkmk versions: v1.2.3, v1.2.3p1 (patch), v1.2.3i1
# (innovation) or v1.2.3b1 (beta). The build rejects anything else, e.g.
# v1.2.3-alpha.1, which would crash the Checkmk server on install.
name: Release MKP

on:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: write   # needed to create GitHub releases and upload assets

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build & Release MKP
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0          # full history so git describe/tags work

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build MKP build image (cached)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: build/Dockerfile
          tags: checkmk-aws-scim-token-build:latest
          load: true
          pull: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run MKP packaging
        run: docker run --rm -v "$PWD:/source" checkmk-aws-scim-token-build:latest

      - name: Determine pre-release flag
        id: meta
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$TAG" =~ [ib][0-9]+$ ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          generate_release_notes: true
          files: "*.mkp"
