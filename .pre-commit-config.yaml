# Linters and secret scanning. CI runs exactly these hooks
# (.github/workflows/ci.yml, job "lint"), so a clean local run means a clean
# CI run. Setup: see "Pre-commit hooks" in README.md.
#
# Hook repos are pinned to commit SHAs (tags can be moved upstream); the
# "# frozen:" comment names the release. Update with `pre-commit autoupdate --freeze`.
minimum_pre_commit_version: "4.0.0"
# `pre-commit install` sets up both the file checks and the commit message check
default_install_hook_types: [pre-commit, commit-msg]

repos:
  # Commit messages must be Conventional Commits; they drive the releases
  - repo: https://github.com/commitizen-tools/commitizen
    rev: 3f5ccc87b27966d9ed21cf5ea8ec2fba38ca65ce  # frozen: v4.19.0
    hooks:
      - id: commitizen

  # Secrets: blocks commits that contain credentials or private keys
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: a56c0b927e6465d37cae3e97d35d4d18ab2b96cd  # frozen: v0.16.9
    hooks:
      - id: ruff-check
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 7ff8d35ae36a7d2b968f2f90b4c723e292e594ee  # frozen: v2.3.1
    hooks:
      - id: mypy
        # Checkmk libraries are not installable; `cmk.*` imports are ignored
        # (pyproject.toml) and the plugin is exercised by the pytest jobs.
        files: ^(build|cmk_addons)/.*\.py$
        # pydantic of the oldest supported Checkmk (2.4.0 ships 2.10.3), so type
        # checks catch newer APIs; bump with "version.min_required" in
        # build/build-modify-extension.py
        additional_dependencies: ["pydantic==2.13.5"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/AleksaC/hadolint-py
    rev: 6e7504451511eaeb62a3e7f14d63b0296cbf86eb  # frozen: v2.15.1
    hooks:
      - id: hadolint

  - repo: https://github.com/Mateusz-Grzelinski/actionlint-py
    rev: 805f85e558841bf4d852335e036b33d2b26be1cc  # frozen: v1.7.12.25
    hooks:
      - id: actionlint
